name: Build HabitFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: flutter create --platforms=android --project-name habitflow .

      - name: Configure Android SDK and notification scheduling
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '    defaultConfig {'
          block = '''    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }\n\n'''
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace(marker, block + marker)
          dep = '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s = s.replace('dependencies {\n', 'dependencies {\n' + dep)
          p.write_text(s)
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />')
          receiver = '''        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n'''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receiver + '    </application>')
          m.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Patch file_picker Android compile SDK
        run: |
          FILE_PICKER_DIR="$PUB_CACHE/hosted/pub.dev/file_picker-8.1.7"
          test -f "$FILE_PICKER_DIR/android/build.gradle"
          sed -i 's/compileSdk 34/compileSdk 36/g' "$FILE_PICKER_DIR/android/build.gradle"

      - name: Repair Dart syntax
        run: |
          python3 -c "from pathlib import Path; import base64; p=Path('lib/main.dart'); s=p.read_text(); a=s.index('  void themeDialog'); b=s.index('  void achievements', a); r=base64.b64decode('').decode(); p.write_text(s[:a]+r+s[b:])"
          dart format lib/main.dart
          flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
