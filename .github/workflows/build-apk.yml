name: Build HabitFlow APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: flutter create --platforms=android --project-name habitflow .

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Dart closing parentheses
        run: |
          sed -i '132s/]))));/])))));/' lib/main.dart
          sed -i '294s/]))));/])))));/' lib/main.dart

      - name: Analyze app source
        run: flutter analyze lib || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
