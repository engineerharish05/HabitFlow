name: Build HabitFlow APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare Android project
        run: flutter create --platforms=android --project-name habitflow .
      - name: Configure Android notifications
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          marker = '    defaultConfig {'
          if 'isCoreLibraryDesugaringEnabled = true' not in s:
              s = s.replace(marker, '    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true\n    }\n\n' + marker)
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in s:
              s = s.replace('dependencies {\n', 'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n')
          p.write_text(s)
          m = Path('android/app/src/main/AndroidManifest.xml')
          s = m.read_text()
          s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />')
          receiver = '''        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n'''
          if 'ScheduledNotificationReceiver' not in s:
              s = s.replace('</application>', receiver + '    </application>')
          m.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Patch file_picker Android compile SDK
        run: |
          FILE_PICKER_DIR="$PUB_CACHE/hosted/pub.dev/file_picker-8.1.7"
          test -f "$FILE_PICKER_DIR/android/build.gradle"
          sed -i 's/compileSdk 34/compileSdk 36/g' "$FILE_PICKER_DIR/android/build.gradle"
      - name: Repair Dart source
        run: |
          python3 -c "from pathlib import Path; p=Path('lib/main.dart'); s=p.read_text(); lines=s.splitlines(); lines[330]=\"  @override Widget build(BuildContext c) => ListView(padding: const EdgeInsets.all(20), children: [Text('Profile', style: Theme.of(c).textTheme.headlineSmall), ListTile(title: Text(store.name.isEmpty ? 'Your name' : store.name), trailing: IconButton(onPressed: () => profileEditor(c), icon: const Icon(Icons.edit_outlined))), ListTile(title: const Text('Completions'), trailing: Text('${store.habits.fold<int>(0, (s, h) => s + h.doneDates.length)}')), ListTile(title: const Text('Best streak'), trailing: Text('${store.habits.fold<int>(0, (m, h) => h.bestStreak() > m ? h.bestStreak() : m)}')), ListTile(title: const Text('Export CSV'), onTap: csvExport), ListTile(title: const Text('Backup JSON'), onTap: backup), ListTile(title: const Text('Restore JSON'), onTap: () => restore(c)), ListTile(title: const Text('Appearance'), onTap: () => themeDialog(c)), ListTile(title: const Text('Achievements'), onTap: () => achievements(c))]);\"; lines[331]=\"  void themeDialog(BuildContext c) => showDialog<void>(context: c, builder: (d) => SimpleDialog(title: const Text('Appearance'), children: ThemeMode.values.map((m) => SimpleDialogOption(onPressed: () { store.setMode(m); Navigator.pop(d); }, child: Text(m.name))).toList()));\n  void achievements(BuildContext c) { final done=store.habits.fold<int>(0,(s,h)=>s+h.doneDates.length); final best=store.habits.fold<int>(0,(m,h)=>h.bestStreak()>m?h.bestStreak():m); showModalBottomSheet<void>(context:c,builder:(_)=>ListView(children:[const Text('Achievements'),Achievement('🌱','First Habit',store.habits.isNotEmpty),Achievement('🔥','7-day Streak',best>=7),Achievement('🚀','30-day Streak',best>=30),Achievement('💯','100 Check-ins',done>=100)])); }\"; a=s.index('Future<void> editHabit'); r=__import__('base64').b64decode('').decode(); p.write_text(s[:a]+r+'\n')"
          dart format lib/main.dart
          flutter analyze lib
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
