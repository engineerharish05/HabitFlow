name: Build HabitFlow APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name habitflow .
      - name: Set Android SDK
        run: sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
      - name: Configure notification manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          text=p.read_text()
          text=text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />')
          marker='    <application'
          receivers='''    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n        <intent-filter>\n            <action android:name="android.intent.action.BOOT_COMPLETED"/>\n            <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n            <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n            <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n        </intent-filter>\n    </receiver>\n'''
          text=text.replace(marker, receivers+marker, 1)
          p.write_text(text)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Patch file_picker
        run: |
          f="$PUB_CACHE/hosted/pub.dev/file_picker-8.1.7/android/build.gradle"
          test -f "$f"
          sed -i 's/compileSdk 34/compileSdk 36/g' "$f"
      - name: Format and analyze
        run: |
          dart format lib/main.dart
          flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
